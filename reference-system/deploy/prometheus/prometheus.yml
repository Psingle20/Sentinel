# Reference-system Prometheus. Every reference service pushes metrics over OTLP
# (--web.enable-otlp-receiver), so there are no scrape targets.
global:
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

otlp:
  promote_resource_attributes:
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 30s
